    <filter id="soft-shadow" x="35" y="45" width="442" height="442" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#5B4A22" flood-opacity="0.16"/>
    </filter>
    <filter id="mail-shadow" x="105" y="115" width="302" height="298" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#113F36" flood-opacity="0.24"/>
    </filter>
    <filter id="badge-shadow" x="319" y="115" width="118" height="118" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
