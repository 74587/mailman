<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mailman logo</title>
  <desc id="desc">Rounded Mailman app icon with an envelope and a gold M badge.</desc>
  <defs>
    <linearGradient id="app-bg" x1="74" y1="64" x2="434" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.58" stop-color="#F8F3E6"/>
      <stop offset="1" stop-color="#EEF8EF"/>
    </linearGradient>
    <linearGradient id="inner-glow" x1="105" y1="93" x2="405" y2="427" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#EAF8ED" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="mail-face" x1="156" y1="145" x2="356" y2="363" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.6" stop-color="#FCF7EA"/>
      <stop offset="1" stop-color="#F7F4E9"/>
    </linearGradient>
    <linearGradient id="teal-stroke" x1="145" y1="173" x2="367" y2="337" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123F37"/>
      <stop offset="1" stop-color="#0E4A41"/>
    </linearGradient>
    <linearGradient id="accent-stroke" x1="150" y1="321" x2="360" y2="321" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F8B80"/>
      <stop offset="1" stop-color="#2C9A8F"/>
    </linearGradient>
    <linearGradient id="badge-bg" x1="345" y1="139" x2="413" y2="217" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7D47C"/>
