    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="21" y="20" width="470" height="472" rx="104" fill="url(#app-bg)"/>
    <rect x="34" y="33" width="444" height="444" rx="94" fill="url(#inner-glow)" fill-opacity="0.54"/>
    <rect x="33" y="32" width="446" height="446" rx="95" stroke="#D8C799" stroke-width="4"/>
  </g>

  <g filter="url(#mail-shadow)">
    <path d="M136 189C136 165.804 154.804 147 178 147H335C358.196 147 377 165.804 377 189V323C377 346.196 358.196 365 335 365H178C154.804 365 136 346.196 136 323V189Z" fill="url(#mail-face)"/>
    <path d="M136 189C136 165.804 154.804 147 178 147H335C358.196 147 377 165.804 377 189V323C377 346.196 358.196 365 335 365H178C154.804 365 136 346.196 136 323V189Z" stroke="url(#teal-stroke)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M150 188L246.079 271.12C251.949 276.197 260.641 276.197 266.511 271.12L362 188" stroke="#123F37" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M155 342L231 272" stroke="url(#accent-stroke)" stroke-width="13" stroke-linecap="round"/>
    <path d="M357 342L281 272" stroke="url(#accent-stroke)" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g filter="url(#badge-shadow)">
    <circle cx="377" cy="177" r="44" fill="url(#badge-bg)" stroke="#8B5B14" stroke-width="5"/>
    <path d="M354 193V162L377 185L400 162V193" stroke="#6D4711" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
