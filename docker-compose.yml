services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mailman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailman}
      POSTGRES_USER: ${POSTGRES_USER:-mailman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 文件中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mailman-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailman} -d ${POSTGRES_DB:-mailman}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mailman All-in-One (Backend + Frontend)
  mailman:
    build:
      context: .
      dockerfile: Dockerfile.all
    container_name: mailman-app
    restart: unless-stopped
    ports:
      - "${MAILMAN_PORT:-8080}:8080"
    environment:
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080

      # Database - PostgreSQL
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-mailman}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 文件中设置 POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-mailman}

      # Optional: encryption key for sensitive data
      # ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # Optional: OAuth2 redirect URIs
      # GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8080/api/oauth2/callback/gmail}
      # OUTLOOK_REDIRECT_URI: ${OUTLOOK_REDIRECT_URI:-http://localhost:8080/api/oauth2/callback/outlook}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mailman_data:/app/data
    networks:
      - mailman-network

networks:
  mailman-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mailman_data:
    driver: local
